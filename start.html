<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Start Control</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(circle at top left, #243b55, transparent 45%),
        radial-gradient(circle at bottom right, #6a11cb, transparent 45%),
        linear-gradient(135deg, #0f172a, #111827);

      color: white;
      overflow: hidden;
    }

    /* Main Card */
    .card {
      width: min(90%, 400px);
      padding: 45px 30px;

      text-align: center;

      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);

      border-radius: 28px;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.35),
        inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }

    .icon {
      width: 75px;
      height: 75px;

      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: linear-gradient(135deg, #6366f1, #8b5cf6);

      font-size: 32px;

      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 35px;
    }

    /* Status */
    .status {
      margin-bottom: 25px;
      font-size: 14px;
      color: #cbd5e1;
    }

    .status span {
      font-weight: bold;
      color: #4ade80;
      transition: 0.3s;
    }

    /* Button */
    .start-btn {
      width: 100%;
      height: 65px;

      border: none;
      border-radius: 18px;

      color: white;
      font-size: 19px;
      font-weight: bold;

      cursor: pointer;

      background: linear-gradient(135deg, #22c55e, #16a34a);

      box-shadow:
        0 10px 25px rgba(34, 197, 94, 0.35);

      transition:
        background 0.3s ease,
        transform 0.15s ease,
        box-shadow 0.3s ease;
    }

    .start-btn:hover {
      transform: translateY(-2px);

      box-shadow:
        0 15px 30px rgba(34, 197, 94, 0.45);
    }

    .start-btn:active {
      transform: scale(0.97);
    }

    /* STOP state */
    .start-btn.stop {
      background: linear-gradient(135deg, #ef4444, #dc2626);

      box-shadow:
        0 10px 25px rgba(239, 68, 68, 0.4);
    }

    .start-btn.stop:hover {
      box-shadow:
        0 15px 30px rgba(239, 68, 68, 0.5);
    }

    /* Bottom text */
    .footer {
      margin-top: 25px;
      color: #94a3b8;
      font-size: 12px;
    }

    /* Small screen */
    @media (max-width: 480px) {
      .card {
        padding: 35px 22px;
      }

      h1 {
        font-size: 24px;
      }

      .start-btn {
        height: 60px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icon">⚡</div>

    <h1>Control Panel</h1>

    <p class="subtitle">
      Simple Start & Stop Controller
    </p>

    <div class="status">
      Status:
      <span id="statusText">Ready</span>
    </div>

    <button
      id="startButton"
      class="start-btn"
      onclick="toggleSystem()"
    >
      START
    </button>

    <div class="footer">
      Tap the button to change the system state
    </div>

  </div>


  <script>
    let isRunning = false;

    function toggleSystem() {

      const button = document.getElementById("startButton");
      const status = document.getElementById("statusText");

      isRunning = !isRunning;

      if (isRunning) {

        // STOP state
        button.classList.add("stop");
        button.textContent = "STOP";

        status.textContent = "Running";
        status.style.color = "#f87171";

      } else {

        // START state
        button.classList.remove("stop");
        button.textContent = "START";

        status.textContent = "Ready";
        status.style.color = "#4ade80";

      }
    }
  </script>

</body>
</html>
